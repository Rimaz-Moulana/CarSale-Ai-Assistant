version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: carsales-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - carsales-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: carsales-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - carsales-network

  ollama:
    image: ollama/ollama:latest
    container_name: carsales-ollama
    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - carsales-network

  ollama-init:
    image: curlimages/curl:latest
    container_name: carsales-ollama-init
    depends_on:
      - ollama
    networks:
      - carsales-network
    command: >
      sh -c "echo 'Waiting for Ollama...'; while ! curl -s http://carsales-ollama:11434/api/tags > /dev/null; do sleep 2; done; echo 'Pulling llama3.2:1b...'; curl -s -X POST http://carsales-ollama:11434/api/pull -d '{\"name\": \"llama3.2:1b\"}'; echo 'Done!';"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: carsales-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json:ro
      - ./keycloak-theme/carsale:/opt/keycloak/themes/carsale:ro
    networks:
      - carsales-network

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: carsales-backend
    restart: unless-stopped
    ports:
      - "5099:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - carsales-network
    depends_on:
      - postgres
      - ollama
      - keycloak

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: carsales-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - carsales-network
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:

networks:
  carsales-network:
    driver: bridge